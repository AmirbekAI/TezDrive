spring.application.name=TezDrive

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tez_drive}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:6d80d5f3a2b1c9e8f74a62d0b3e5f1a8c9d2e7b4f6a0c3d8e1b5f9a2c6d0e4b7}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework.security=DEBUG

server.port=8080

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudflare R2
r2.endpoint=https://0d2622d5aa182e39209964d2d6b6f72c.r2.cloudflarestorage.com
r2.bucket=${R2_BUCKET:tez-drive-storage}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.public-base-url=https://pub-1ea80174cb174415b3ee4c932d9283ab.r2.dev
